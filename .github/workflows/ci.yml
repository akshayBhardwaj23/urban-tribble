name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db

      - name: Migrations apply to a clean Postgres
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres

      # Runs against the schema the migration step just built, so it also
      # confirms the migrated tables are usable by the ORM. Needs real
      # Postgres: SQLite serializes writers at the connection level, so a
      # broken compare-and-swap would still look like it had one winner.
      # Destructive (truncates users/workspaces/integrations) -- throwaway
      # databases only, never a live one.
      - name: Sync-claim concurrency proof (real Postgres)
        run: pytest tests/test_integrations.py -k ClaimConcurrency -q
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
          INTEGRATION_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          INTERNAL_AUTH_SECRET: ci-placeholder-secret

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t snaptix-api ./backend
