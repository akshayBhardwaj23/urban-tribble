services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snaptix
      POSTGRES_PASSWORD: snaptix
      POSTGRES_DB: snaptix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snaptix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for S3 so the object-storage path is exercised locally.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/snaptix &&
      echo bucket ready"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://snaptix:snaptix@db:5432/snaptix
      STORAGE_BACKEND: s3
      S3_BUCKET: snaptix
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      CORS_ORIGINS: http://localhost:3000
      LOG_JSON: "true"
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"

volumes:
  pgdata:
  miniodata:
